stages:
  - build
  - deploy

build_pkg:
  stage: build
  image: archlinux:latest
  cache: {}
  script:
    - pacman -Sy --noconfirm base-devel
    - useradd builder -m
    - passwd -d builder
    - printf 'builder ALL=(ALL) ALL\n' | tee -a /etc/sudoers
    - chown -R builder:builder .
    - sudo -u builder makepkg -s --noconfirm

  artifacts:
    paths:
      - "*.pkg.tar.zst"
  variables:
    GIT_STRATEGY: fetch
    GIT_CLEAN_FLAGS: -ffdx

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git curl
  script:
    - git config --global user.email "bot@bakeryos.smtdfc"
    - git config --global user.name "Bakery OS Bot"
    - git clone https://oauth2:$AUTH_TOKEN@gitlab.com/bakery-os/bakery-os-repositories.git repo_temp
    - mkdir -p repo_temp/$PKG_NAME
    - cp -p *.pkg.tar.zst repo_temp/$PKG_NAME/
    - cd repo_temp
    - git add .
    - git commit -m "Auto-deploy $PKG_NAME"
    - git push https://oauth2:$AUTH_TOKEN@gitlab.com/bakery-os/bakery-os-repositories.git HEAD:main
