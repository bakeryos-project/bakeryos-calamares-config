# Workaround for GRUB failing with "premature end of file" on btrfs.
#
# unpackfs copies the kernel from the ISO with rsync --sparse, which creates
# a sparse file on btrfs. The content is correct, but GRUB cannot read sparse
# files, so the kernel fails to load. Copy the kernel once more with
# --sparse=never (and without reflinks) to get fully allocated extents.
#
# Do not use ${...} shell expansions here: Calamares treats them as
# undefined environment variables and refuses to run the command.
---
dontChroot: false
timeout: 60
script:
    - 'mkdir -p /tmp/kernel-rewrite'
    - 'find /boot -maxdepth 1 -type f -name "vmlinuz-*" -exec cp -f --reflink=never --sparse=never -t /tmp/kernel-rewrite {} +'
    - 'find /tmp/kernel-rewrite -maxdepth 1 -type f -exec mv -f -t /boot/ {} +'
    - 'rm -rf /tmp/kernel-rewrite'
